[project]
name = "sentinel"
version = "0.1.0"
description = "A risk analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.71",
    "dash>=4.4.1",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
    "uvloop>=0.22.1",
    "watchfiles>=1.2.0",
    "xgboost>=3.2.0",
    "yfinance>=1.5.2",
]

[project.scripts]
stl = "cli.cli.cli"
