[project]
name = "sentinel"
version = "0.1.0"
description = "A risk analytics platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "ccxt>=4.5.71",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "hermes-plt>=0.2.11",
    "llvmlite>=0.43",
    "mlflow==1.27.0",
    "numba>=0.60",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "prophet>=1.3.0",
    "protobuf>=3.20,<5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pyod>=3.6.4",
    "scikit-learn>=1.9.0",
    "setuptools>=70,<81",
    "sqlalchemy>=2.0.51",
    "tabulate>=0.10.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
    "uvloop>=0.22.1",
    "watchfiles>=1.2.0",
    "websockets>=17.0.1",
    "xgboost>=3.2.0",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.uv]
package = true
constraint-dependencies = ["numba>=0.60", "llvmlite>=0.43"]

[project.scripts]
stl = "sentinel.cli.cli:cli"
